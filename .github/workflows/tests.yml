name: LinuxAcademy tests
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest httpx
      - name: Check installer and URL helper syntax
        run: bash -n scripts/install.sh scripts/site-url.sh scripts/backup.sh
      - name: Verify installer restarts the live service
        run: |
          grep -Fq 'systemctl restart linuxacademy.service' scripts/install.sh
          grep -Fq '"$INSTALL/scripts/site-url.sh"' scripts/install.sh || grep -Fq 'bash "$INSTALL/scripts/site-url.sh"' scripts/install.sh
      - name: Compile Python files
        run: python -m compileall -q app manage.py content/build_curriculum.py
      - name: Run application tests
        run: python -m pytest -q tests

  build-images:
    name: Build ${{ matrix.image }} laboratory image
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [ubuntu, debian, alma, fedora, arch, opensuse, alpine]
    steps:
      - uses: actions/checkout@v4
      - name: Build laboratory Containerfile
        run: docker build --pull -t linuxacademy-${{ matrix.image }}:ci -f images/Containerfile.${{ matrix.image }} images/
