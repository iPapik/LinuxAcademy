name: Expand LinuxAcademy initial source bundle
on:
  push:
    branches: [main]
    paths:
      - 'source/LinuxAcademy.tar.xz.base64'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Verify and expand project sources
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode source/LinuxAcademy.tar.xz.base64 > /tmp/LinuxAcademy.tar.xz
          echo 'e4fd4fe524dad95cd0ac5f07d5a719ae5aa839b11a252cb79b5829126ad538ca  /tmp/LinuxAcademy.tar.xz' | sha256sum -c -
          tar -tf /tmp/LinuxAcademy.tar.xz | head -n 10
          tar -xJf /tmp/LinuxAcademy.tar.xz --strip-components=1
          test -f app/main.py
          test -f scripts/install.sh
          test -f content/curriculum.json
          test -f static/vendor/xterm.js
          python3 -m compileall -q app manage.py content/build_curriculum.py
          rm -rf app/__pycache__ content/__pycache__ __pycache__
          cat > .gitignore <<'EOF'
          __pycache__/
          *.py[cod]
          .pytest_cache/
          .venv/
          .env
          .env.*
          !*.env.example
          *.sqlite3
          *.db
          *.log
          EOF
          rm -rf source
      - name: Publish sources on main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Import LinuxAcademy 1.0 complete source files'
          git push origin HEAD:main
